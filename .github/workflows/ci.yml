name: CI

# FR-0.6 requires the target-independent logic to build and run on the host, and Phase 1
# (FR-1.6) requires host unit tests plus a static analysis step on every push. Both are
# wired up here from Phase 0 so that the guarantee exists as soon as there is code to
# guarantee anything about.
#
# Four jobs, because they fail for genuinely different reasons:
#   host-tests       the application logic is wrong, or the C/C++ boundary has broken
#   firmware-build   the target build, the FreeRTOS port or the HAL does not compile
#   static-analysis  the code is suspect without being wrong yet
#   host-tools       the Python telemetry parser (folded into host-tests via ctest)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Keep the "is it broken or is it flaky" question out of CI: warnings are failures.
  NODE_SANITIZERS: "ON"
  # clang-tidy check set, shared by the three scopes below so they cannot drift apart.
  # Read it as: everything that finds defects, minus three checks that do not suit this
  # codebase, each with its reason.
  #
  #   -bugprone-easily-swappable-parameters
  #       fires on every coordinate and measurement API (draw_hline(x0, x1, y), a
  #       constructor taking (period, conversion_time)). It cannot tell an intended
  #       parameter pair from a mistake, and on a geometry-heavy interface the noise
  #       buries the signal.
  #   -performance-enum-size
  #       proposes uint8_t-backed enums. Worth bytes on a table of thousands of values,
  #       not on the handful this firmware has.
  #   -clang-analyzer-optin.performance.Padding
  #       proposes reordering struct fields for a few bytes of padding. It would have the
  #       task table in board.h read "name, priority, stack, period, id" instead of
  #       starting with the id, and the 40 bytes it saves are not worth that.
  #
  # clang-analyzer-core.FixedAddressDereference is excluded only for the HAL and RTOS port,
  # in that job step: dereferencing a fixed address is what memory-mapped I/O *is*, so the
  # check fires on every peripheral register access. It stays enabled for the C++
  # application core, where a fixed-address dereference really would be a bug.
  # Single line, not a folded block: a folded scalar turns the line breaks into spaces,
  # which would leave " -bugprone-..." with a leading space in the list, and clang-tidy
  # matches check names literally.
  CLANG_TIDY_CHECKS: "-*,bugprone-*,clang-analyzer-core.*,clang-analyzer-deadcode.*,clang-analyzer-security.*,performance-*,portability-*,-bugprone-easily-swappable-parameters,-performance-enum-size"

jobs:
  host-tests:
    name: Host unit tests (FR-0.6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        # The application core is compiled with -Werror, so this step is also the
        # compile-time style gate.
        run: cmake --build build

      - name: Run tests
        # ctest runs both the GoogleTest binary (142 cases) and the host-tooling suite,
        # and fails if either does.
        working-directory: build
        run: ctest --output-on-failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: host-test-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  firmware-build:
    name: Firmware cross-build (arm-none-eabi)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        # libstdc++-arm-none-eabi-newlib is a separate package from the compiler on
        # Debian and Ubuntu, and the target build needs it: the application core is C++
        # and includes <atomic>, so the arm-none-eabi C++ standard headers have to be
        # present or the build fails before it reaches anything of ours.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Configure
        run: |
          cmake -B build-arm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
            -DSTM32_TOOLCHAIN_DIR=/usr/bin

      - name: Build
        run: cmake --build build-arm

      - name: Check the image actually has a reset vector
        # The classic -nostartfiles failure: the image links, and there is no usable
        # entry point. Catching it here rather than on a bench is the whole point.
        run: |
          arm-none-eabi-nm build-arm/firmware/firmware.elf | grep -i ' Reset_Handler$'
          arm-none-eabi-objdump -h build-arm/firmware/firmware.elf | grep -q '\.isr_vector'

      - name: Report image size against the F103C8T6 budget
        # 64 KB flash, 20 KB RAM. A regression here is a real defect, not a warning. The
        # linker script enforces the same limits, so this is a second, earlier signal.
        run: |
          arm-none-eabi-size build-arm/firmware/firmware.elf
          python3 - <<'PY'
          import subprocess, sys

          out = subprocess.check_output(
              ["arm-none-eabi-size", "build-arm/firmware/firmware.elf"], text=True)
          text, data, bss = (int(x) for x in out.strip().splitlines()[-1].split()[:3])

          flash, ram = text + data, data + bss
          print(f"flash={flash} / 65536 ({flash / 65536:.1%})")
          print(f"static RAM={ram} / 20480 ({ram / 20480:.1%})")

          failures = []
          if flash > 65536:
              failures.append(f"flash over budget by {flash - 65536} bytes")
          if ram > 20480:
              failures.append(f"static RAM over budget by {ram - 20480} bytes")
          for failure in failures:
              print(f"::error::{failure}")
          sys.exit(1 if failures else 0)
          PY

      - name: Upload firmware artefacts
        uses: actions/upload-artifact@v5
        with:
          name: firmware
          path: |
            build-arm/firmware/firmware.elf
            build-arm/firmware/firmware.hex
            build-arm/firmware/firmware.bin
            build-arm/firmware/firmware.map

  static-analysis:
    name: Static analysis (FR-1.6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ clang-tidy cppcheck \
            gcc-arm-none-eabi binutils-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Configure both trees
        # clang-tidy analyses against a compile database, so each tree has to be
        # configured before anything can be checked. The target tree matters because the
        # HAL and the entry point exist only there.
        run: |
          cmake -B build -G Ninja
          cmake -B build-arm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
            -DSTM32_TOOLCHAIN_DIR=/usr/bin

      - name: clang-tidy — application core
        run: |
          # main_target.cpp is excluded here on purpose: it is not in this tree's compile
          # database, so clang-tidy would fall back to guessed flags and report the
          # FreeRTOS headers as missing. It is checked in its own step below.
          core=$(ls firmware/app/src/*.cpp | grep -v main_target)
          clang-tidy -p build \
            -checks="$CLANG_TIDY_CHECKS" \
            -warnings-as-errors='*' \
            -header-filter='firmware/(app|hal|rtos)/.*' \
            $core

      - name: clang-tidy — target entry point
        # This file needs the arm-none-eabi C++ standard headers, which are not on
        # clang's default search path: clang has its own resource directory, so a
        # cross-compiled C++ file cannot find <cstddef> without being told where the
        # target's libstdc++ lives.
        run: |
          cxxinc=$(ls -d /usr/lib/arm-none-eabi/include/c++/*/ | head -1)
          # c++config.h lives in <multilib>/bits/, but cstddef asks for
          # <bits/c++config.h>, so the -isystem path must be the multilib dir
          # itself (two dirnames up from the file), not the bits/ dir.
          cfg=$(find "$cxxinc" -path '*thumb/v7-m/nofp*' -name c++config.h | head -1)
          bitsdir=$(dirname "$(dirname "$cfg")")
          if [ -z "$cfg" ] || [ ! -f "$bitsdir/bits/c++config.h" ]; then
            echo "::error::multilib c++config.h not found under $cxxinc"
            exit 1
          fi
          clang-tidy -p build-arm \
            --extra-arg=-isystem"$cxxinc" \
            --extra-arg=-isystem"$bitsdir" \
            --extra-arg=-isystem/usr/lib/arm-none-eabi/include \
            -checks="$CLANG_TIDY_CHECKS" \
            -warnings-as-errors='*' \
            firmware/app/src/main_target.cpp

      - name: clang-tidy — STM32 HAL and FreeRTOS port
        # FixedAddressDereference is excluded here and only here: every access to a
        # peripheral register dereferences a fixed address, which is what the check is
        # looking for, so on this code it reports the design rather than a defect.
        run: |
          # clang-tidy uses the host clang's include paths, not the ARM
          # toolchain's, so the newlib + gcc freestanding headers must be added
          # explicitly (same reason as the step above). Without this the C files
          # fail with "'string.h' file not found".
          gccinc=$(dirname "$(arm-none-eabi-gcc -print-file-name=include/stddef.h)")
          clang-tidy -p build-arm \
            --extra-arg=-isystem/usr/lib/arm-none-eabi/include \
            --extra-arg=-isystem"$gccinc" \
            -checks="$CLANG_TIDY_CHECKS,-clang-analyzer-core.FixedAddressDereference" \
            -warnings-as-errors='*' \
            firmware/hal/stm32f1/*.c firmware/rtos/freertos/*.c

      - name: cppcheck (advisory)
        # Deliberately not gating. clang-tidy above is the gate, and its check set has been
        # run against this tree so its baseline is known to be clean. cppcheck's output on
        # this code has not been inspected, and a gate whose baseline is unknown fails on
        # the first push for reasons unrelated to the change. It reports here so the
        # findings can be reviewed, then promoted to a gate once the baseline is zero.
        continue-on-error: true
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --inline-suppr \
            --std=c++17 --language=c++ \
            --suppress=missingIncludeSystem \
            --quiet \
            -I firmware/app/include \
            -I firmware/hal/include \
            -I firmware/rtos/include \
            firmware/app/src 2>&1 | tee cppcheck.log
